/* fondo de cada mundo (tools/fondos.py): la escena queda fija detrás del contenido, bajo un velo del color del mundo */
.screen.scr-world, .screen.scr-stage {

/* ---------- consola: pantalla a la izquierda, mando a la derecha ---------- */
.gba {
  width: 100%; max-width: 1320px; height: 100%; max-height: 880px;
  display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 4px;
  padding: 16px 6px 22px 18px; background: var(--shell);
  border-radius: 30px 30px 54px 30px;
  box-shadow: inset 0 5px 0 0 var(--shell-hi), inset 0 -9px 0 0 var(--shell-lo), inset -5px 0 0 0 var(--shell-lo), 0 12px 0 0 rgba(0, 0, 0, .4);

  position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column;
  padding: 26px 14px 14px; background: var(--bezel); border-radius: 14px 14px 26px 14px;

  position: relative;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;

  background-size: 24px 24px; background-position: 0 0, 12px 12px; background-attachment: local;

/* .fit envuelve cada pantalla: se encoge lo justo para caber en el alto disponible */
.fit { position: relative; display: flex; flex-direction: column; gap: 8px; transform-origin: 0 0; }
.fit > * { flex-shrink: 0; }

.pad { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 4px; color: var(--shell-ink); min-height: 0; }

.dpad::before { content: ''; position: absolute; left: 44px; top: 44px; width: 44px; height: 44px; background: var(--key); }

.dpad .up { left: 44px; top: 0; border-radius: 9px 9px 0 0; }

/* ---------- portada ---------- */

<script>
/* Lógica por Árboles — fórmulas con la notación de Priest (An Introduction to Non-Classical Logic)
   Parámetros proposicionales: p q r s t · predicados: mayúsculas · constantes: a–o · variables: x y z
   Conectivas: ¬ ∧ ∨ ⊃ ≡ (clásicas) · □ ◇ (modales) · ⥽ (estricto) · > (condicional) · → (condicional
   intensional de los capítulos 9–11) · ⊐ (condicional intuicionista) · [F] ⟨F⟩ [P] ⟨P⟩ (tiempo)
   · ∀ ∃ · = (identidad) · E (existencia, en las lógicas libres) */
(function (root) {
'use strict';

const VARS = 'xyzuvw';
const CONSTS = 'abcdefghijklmno';
const PROPS = 'pqrst';
const isVar = c => VARS.includes(c);
const isConst = c => CONSTS.includes(c);

class LErr extends Error {}
const fail = m => { throw new LErr(m); };

/* ---------- constructores ---------- */
const Atom = (p, args) => ({ t: 'atom', p, args: args || [] });
const Not = a => ({ t: 'not', a });
const Un = (t, a) => ({ t, a });
const Bin = (t, a, b) => ({ t, a, b });
const Qf = (t, v, a) => ({ t, v, a });
const Eq = (x, y) => Atom('=', [x, y]);
const Ex = x => Atom('E', [x]);

const BIN = { and: '∧', or: '∨', imp: '⊃', iff: '≡', str: '⥽', cnd: '>', arr: '→', ico: '⊐' };
const UN = { box: '□', dia: '◇', G: '[F]', F: '⟨F⟩', H: '[P]', P: '⟨P⟩' };
const BINOF = {}; Object.keys(BIN).forEach(k => { BINOF[BIN[k]] = k; });
const isBin = f => !!BIN[f.t];
const isUn = f => !!UN[f.t];

function str(f, top) {
  switch (f.t) {
    case 'atom':
      if (f.p === '=') return f.args[0] + '=' + f.args[1];
      return f.p + f.args.join('');
    case 'not': return '¬' + str(f.a, false);
    case 'all': return '∀' + f.v + str(f.a, false);
    case 'ex': return '∃' + f.v + str(f.a, false);
    default: {
      if (UN[f.t]) return UN[f.t] + str(f.a, false);
      const s = str(f.a, false) + BIN[f.t] + str(f.b, false);
      return top === false ? '(' + s + ')' : s;
    }
  }
}

        : [two('⊃−', [S(Not(f.a), M), S(f.b, M), S(f.a, P)], [S(Not(f.a), M), S(f.b, M), S(Not(f.b), P)])];
      return pos   // RM3
        ? [{ r: '⊃+', alts: [[S(f.a, M)], [S(Not(f.b), M)], [S(Bin('and', f.a, Not(f.a)), P), S(Bin('and', f.b, Not(f.b)), P)]] }]
        : [two('⊃−', [S(f.a, P), S(Not(f.b), P), S(Not(f.a), M)], [S(f.a, P), S(Not(f.b), P), S(f.b, M)])];
    case 'ico':   // condicional intuicionista
      if (pos) return B.rel.filter(r => r.a === x && !r.A).map(r => two('⊐+', [S(f.a, M, r.b)], [S(f.b, P, r.b)]));
      return [{ r: '⊐−', fresh: true, make: X => { const j = X.next(); return [[Rl(x, j), S(f.a, P, j), S(f.b, M, j)]]; },
        sat: X => B.rel.some(r => r.a === x && X.has(S(f.a, P, r.b)) && X.has(S(f.b, M, r.b))) }];
    case 'arr':
      if (!normalHere) return [];
      if (sys.arr === 'I4') {
        if (pos) return B.rel.filter(r => r.a === x && !r.A).map(r => two('⊐+', [S(f.a, M, r.b)], [S(f.b, P, r.b)]));
        return [{ r: '⊐−', fresh: true, make: X => { const j = X.next(); return [[Rl(x, j), S(f.a, P, j), S(f.b, M, j)]]; },
          sat: X => B.rel.some(r => r.a === x && X.has(S(f.a, P, r.b)) && X.has(S(f.b, M, r.b))) }];
      }
      if (pos) return worldsAll().map(j => two('→+', [S(f.a, M, j)], [S(f.b, P, j)]));
      return [{ r: '→−', fresh: true, make: X => { const j = X.next(); return [[S(f.a, P, j), S(f.b, M, j)]]; },
        sat: X => X.worlds.some(j => X.has(S(f.a, P, j)) && X.has(S(f.b, M, j))) }];
    default: return [];
  }
}

/* ================= reglas estructurales ================= */
const STRUCT = {
  'ρ': { name: 'Reflexividad', desc: 'Para cada mundo i de la rama, añade iri.',
    inst: (sys, B) => B.worlds.filter(w => !w.endsWith('#')).map(i => one('ρ', Rl(i, i))) },
  'σ': { name: 'Simetría', desc: 'De irj pasa a jri.',
    inst: (sys, B) => B.rel.filter(r => !r.A).map(r => one('σ', Rl(r.b, r.a))) },
  'τ': { name: 'Transitividad', desc: 'De irj y jrk pasa a irk.',
    inst: (sys, B) => { const out = []; B.rel.forEach(r => { if (!r.A) B.rel.forEach(q => { if (!q.A && q.a === r.b) out.push(one('τ', Rl(r.a, q.b))); }); }); return out; } },
  'η': { name: 'Extensibilidad', desc: 'Si el mundo i no ve a ninguno, crea un mundo nuevo j con irj.', fresh: 1,
    inst: (sys, B) => B.worlds.map(i => ({ r: 'η', fresh: true, make: X => [[Rl(i, X.next())]], sat: X => X.rel.some(r => r.a === i && !r.A) })) },
  'her': { name: 'Herencia', desc: 'Lo que vale en un mundo sigue valiendo en los que ve: de p,+i e irj pasa a p,+j (solo letras).',
    inst: (sys, B) => {
      const out = [];
      B.path.forEach(n => {
        if (n.k !== 'f' || n.s !== '+') return;
        const lit = n.f.t === 'atom' || (sys.arr === 'I4' && n.f.t === 'not' && n.f.a.t === 'atom');
        if (lit) B.rel.forEach(r => { if (r.a === n.w && r.b !== n.w) out.push(one('her', F(n.f, r.b, '+'))); });
      });
      return out;
    } },
  'C+': { name: 'Centrado', desc: 'Para cada mundo i y cada antecedente A de un condicional: o bien ¬A,i, o bien A,i e i r_A i.',
    inst: (sys, B) => {
      const ants = new Map();
      B.path.forEach(n => { if (n.k === 'f') { const g = n.f.t === 'not' ? n.f.a : n.f; if (g.t === 'cnd') ants.set(str(g.a), g.a); } });
      const out = [];
      B.worlds.forEach(i => ants.forEach(A => out.push(two('C+', [F(Not(A), i)], [F(A, i), Rl(i, i, A)]))));
      return out;
    } },
  'SI': { name: 'Sustitución de idénticos', desc: 'Con a=b, cambia a por b (o b por a) en una fórmula atómica.',
    inst: (sys, B) => {
      const out = [];
      const ids = B.path.filter(n => n.k === 'f' && !n.s && n.f.t === 'atom' && n.f.p === '=' && n.f.args[0] !== n.f.args[1]);
      const ats = B.path.filter(n => n.k === 'f' && !n.s && n.f.t === 'atom' && n.f.args.length);
      ids.forEach(e => {
        const [a, b] = e.f.args;
        ats.forEach(m => {
          if (m === e || m.w !== e.w) return;
          [[a, b], [b, a]].forEach(([x, y]) => {
            const pos = m.f.args.map((t, i) => (t === x ? i : -1)).filter(i => i >= 0);
            for (let mask = 1; mask < (1 << pos.length); mask++) {
              const args = m.f.args.slice();
              pos.forEach((p, k) => { if (mask & (1 << k)) args[p] = y; });
              out.push(one('SI', F(Atom(m.f.p, args), m.w)));
            }
          });
        });
      });
      return out;
    } }
};
function structOf(sys) {
  const ids = [...sys.R];
  if (sys.int || sys.arr === 'I4') ids.push('her');
  if (sys.cond === 'C+') ids.push('C+');
  if (sys.id && sys.fo) ids.push('SI');
  return ids;
}

/* ================= cierre ================= */
function clash(sys, a, b) {
  if (a.k !== 'f' || b.k !== 'f' || a.w !== b.w) return false;
  if (!sys.sg) {
    if ((a.f.t === 'not' && L.eq(a.f.a, b.f)) || (b.f.t === 'not' && L.eq(b.f.a, a.f))) return true;
    /* a=b y ¬b=a también cierran (12.5.5) */
    const flip = (u, v) => u.f.t === 'atom' && u.f.p === '=' && v.f.t === 'not' && v.f.a.t === 'atom' && v.f.a.p === '=' && u.f.args[0] === v.f.a.args[1] && u.f.args[1] === v.f.a.args[0];
    return flip(a, b) || flip(b, a);
  }
  if (a.s !== b.s && L.eq(a.f, b.f)) return true;
  const negOf = (u, v) => u.f.t === 'not' && L.eq(u.f.a, v.f);
  if ((sys.cl === 'k3' || sys.cl === 'both') && a.s === '+' && b.s === '+' && (negOf(a, b) || negOf(b, a))) return true;
  if ((sys.cl === 'lp' || sys.cl === 'both') && a.s === '-' && b.s === '-' && (negOf(a, b) || negOf(b, a))) return true;
  return false;
}
const selfClash = (sys, a) => a.k === 'f' && !sys.sg && a.f.t === 'not' && a.f.a.t === 'atom' && a.f.a.p === '=' && a.f.a.args[0] === a.f.a.args[1];

/* ================= el árbol ================= */
class Tab {
  constructor(sysId, prem, concl) {
    this.sys = SYS[sysId];
    if (!this.sys) throw new Error('sistema desconocido: ' + sysId);
    this.prem = prem; this.concl = concl;
    this.nodes = []; this.root = null;
    const w = this.sys.W ? '0' : null;
    const init = this.sys.sg ? [...prem.map(f => F(f, w, '+')), F(concl, w, '-')] : [...prem.map(f => F(f, w)), F(Not(concl), w)];
    let at = null;
    init.forEach(spec => { at = this.add(spec, at, null, 'ini'); });
  }
  add(spec, parent, src, rule) {
    const n = Object.assign({}, spec, { id: this.nodes.length + 1, key: keyOf(spec), parent: parent ? parent.id : null, kids: [], src, rule, close: null, decl: false });
    this.nodes.push(n);
    if (parent) parent.kids.push(n.id); else this.root = n;
    return n;
  }
  node(id) { return this.nodes[id - 1]; }
  path(n) { const out = []; for (let m = n; m; m = m.parent ? this.node(m.parent) : null) out.unshift(m); return out; }
  leaves(from) {
    const out = [], go = n => { if (!n.kids.length) out.push(n); else n.kids.forEach(k => go(this.node(k))); };
    go(from || this.root);
    return out;
  }
  openLeaves(from) { return this.leaves(from).filter(l => !l.close); }
  ctx(leaf) { return ctxOf(this.path(leaf), this.sys); }
  status() {
    const ls = this.leaves();
    if (ls.every(l => l.close)) return 'closed';
    if (ls.some(l => l.decl)) return 'open';
    return 'busy';
  }
  /* ¿la instancia ya está cumplida en la rama? */
  sat(I, B, srcId) {
    if (I.fresh) return I.sat(B) || (srcId != null && B.path.some(m => m.src === srcId && m.rule === I.r));
    return I.alts.some(alt => alt.every(sp => B.has(sp)));
  }
  /* alarga la hoja con las alternativas (sin repetir líneas que ya están) */
  extend(leaf, alts, srcId, rule) {
    const B = this.ctx(leaf);
    const made = [];
    if (alts.length === 1) {
      let at = leaf;
      alts[0].forEach(sp => { if (!B.has(sp)) { at = this.add(sp, at, srcId, rule); made.push(at); } });
      return made.length ? [at] : [];
    }
    return alts.map(alt => {
      let at = leaf;
      const todo = alt.filter(sp => !B.has(sp));
      (todo.length ? todo : alt.slice(0, 1)).forEach(sp => { at = this.add(sp, at, srcId, rule); made.push(at); });
      return at;
    });
  }
  /* instancias de la regla de una línea en cada hoja abierta que pasa por ella */
  pending(n) {
    const out = [];
    this.openLeaves(n).forEach(leaf => {
      if (leaf.decl) return;
      const B = this.ctx(leaf);
      expand(this.sys, n, B).forEach(I => { if (!this.sat(I, B, n.id)) out.push({ leaf, I }); });
    });
    return out;
  }
  /* aplica la regla de la línea n en todas las ramas abiertas que pasan por ella */
  apply(id) {
    const n = this.node(id);
    if (!n) return { error: 'Esa línea no existe.' };
    if (n.k !== 'f') return { error: 'Las líneas de la forma irj no tienen regla propia: las usan □, las reglas de la relación y otras.' };
    const todo = this.pending(n);
    if (!todo.length) return { error: this.whyNot(n) };
    let added = 0, rule = todo[0].I.r;
    const leaves = [...new Set(todo.map(t => t.leaf))];
    leaves.forEach(leaf => {
      let tips = [leaf];
      const B0 = this.ctx(leaf);
      expand(this.sys, n, B0).forEach(I => {
        const next = [];
        tips.forEach(tip => {
          const B = this.ctx(tip);
          if (tip.close || this.sat(I, B, n.id)) { next.push(tip); return; }
          const alts = I.fresh ? I.make(B) : I.alts;
          const before = this.nodes.length;
          const t2 = this.extend(tip, alts, n.id, I.r);
          added += this.nodes.length - before;
          next.push(...(t2.length ? t2 : [tip]));
        });
        tips = next;
      });
    });
    return added ? { ok: true, rule, added } : { error: this.whyNot(n) };
  }
  whyNot(n) {
    const f = n.f, g = f.t === 'not' ? f.a : f;
    const lit = f.t === 'atom' || (f.t === 'not' && f.a.t === 'atom');
    if (!this.openLeaves(n).length) return 'Todas las ramas que pasan por esa línea ya están cerradas.';
    if (lit && !(this.sys.sg && this.sys.neg === 'star' && f.t === 'not') && !(this.sys.int && f.t === 'not')) return 'Es una línea atómica (o la negación de una): no hay regla que aplicarle. Sirve para cerrar ramas.';
    if (this.sys.sg) {
      if ((f.t === 'arr' || g.t === 'arr') && (this.sys.arr === 'N4' || this.sys.arr === 'N*') && n.w !== '0') return 'En esta lógica el mundo ' + n.w + ' no es normal: ahí → no tiene regla y su valor queda libre.';
      if ((f.t === 'ico' || (this.sys.int && f.t === 'not')) && n.s === '+') return 'Esta regla se aplica a cada mundo j con ' + n.w + 'rj. Por ahora no hay ninguno nuevo: añade la relación primero.';
    }
    if (g.t === 'box' && this.sys.nn === 'L' && n.w !== '0') return 'En L (S0.5) las reglas modales solo se aplican en el mundo 0.';
    if (f.t === 'dia' && this.sys.nn === 'N') return 'El mundo ' + n.w + ' puede ser no normal: ahí ◇A es verdad sin más. La regla de ◇ solo se activa si el mundo tiene algo de la forma □B.';
    if (f.t === 'box' || f.t === 'G' || f.t === 'H' || f.t === 'cnd') return 'Ya está aplicada a todos los mundos accesibles de la rama. Si aparece uno nuevo, vuelve a esta línea.';
    if (f.t === 'all') return 'Ya está aplicada a todos los nombres de la rama. Si aparece uno nuevo, vuelve a esta línea.';
    return 'Esa regla ya está aplicada en todas las ramas que pasan por aquí.';
  }
  /* reglas estructurales: se aplican todas las instancias pendientes de una vez */
  structPending(rid) {
    const R = STRUCT[rid], out = [];
    this.openLeaves().forEach(leaf => {
      if (leaf.decl) return;
      const B = this.ctx(leaf);
      R.inst(this.sys, B).forEach(I => { if (!this.sat(I, B, null)) out.push({ leaf, I }); });
    });
    return out;
  }
  applyStruct(rid) {
    const R = STRUCT[rid];
    const todo = this.structPending(rid);
    if (!todo.length) return { error: 'La regla ' + rid + ' no añade nada nuevo ahora.' };
    let added = 0;
    const leaves = [...new Set(todo.map(t => t.leaf))];
    leaves.forEach(leaf => {
      let rounds = 0, tips = [leaf];
      /* σ, τ, herencia y SI se repiten hasta que no añaden nada; η y C+ dan una sola vuelta */
      do {
        let grew = false;
        const next = [];
        tips.forEach(tip => {
          if (tip.close) { next.push(tip); return; }
          let cur = [tip];
          const insts = R.inst(this.sys, this.ctx(tip));
          insts.forEach(I => {
            const nx = [];
            cur.forEach(t => {
              const B = this.ctx(t);
              if (this.sat(I, B, null)) { nx.push(t); return; }
              const before = this.nodes.length;
              const t2 = this.extend(t, I.fresh ? I.make(B) : I.alts, null, I.r);
              if (this.nodes.length > before) { grew = true; added += this.nodes.length - before; }
              nx.push(...(t2.length ? t2 : [t]));
            });
            cur = nx;
          });
          next.push(...cur);
        });
        tips = next;
        if (!grew || R.fresh || rid === 'C+') break;
      } while (++rounds < 12);
    });
    return added ? { ok: true, rule: rid, added } : { error: 'La regla ' + rid + ' no añade nada nuevo ahora.' };
  }
  /* cierre de ramas: dos líneas contradictorias de la misma rama (o una, como ¬a=a) */
  tryClose(id1, id2) {
    const a = this.node(id1), b = id2 ? this.node(id2) : null;
    if (!b) {
      if (!selfClash(this.sys, a)) return { error: 'Para cerrar una rama elige dos líneas que se contradigan.' };
    } else if (!clash(this.sys, a, b)) return { error: this.sys.sg ? 'Esas dos líneas no chocan: hace falta la misma fórmula con + y con − en el mismo mundo.' : 'Esas dos líneas no se contradicen: hace falta A y ¬A en el mismo mundo.' };
    const pa = this.path(a), deep = b && this.path(b).length > pa.length ? b : a, other = deep === a ? b : a;
    if (other && !this.path(deep).includes(other)) return { error: 'Esas líneas están en ramas distintas.' };
    const ls = this.openLeaves(deep).filter(l => !l.decl);
    if (!ls.length) return { error: 'Las ramas que pasan por ahí ya están cerradas.' };
    ls.forEach(l => { l.close = { by: b ? [a.id, b.id].sort((x, y) => x - y) : [a.id] }; });
    return { ok: true, n: ls.length };
  }
  /* primera contradicción a la vista en una rama */
  findClash(leaf) {
    const p = this.path(leaf);
    for (let i = 0; i < p.length; i++) {
      if (selfClash(this.sys, p[i])) return [p[i].id];
      for (let j = 0; j < i; j++) if (clash(this.sys, p[i], p[j])) return [p[j].id, p[i].id];
    }
    return null;
  }
  /* ¿la rama está completa? (toda regla aplicable ya dejó su huella) */
  incomplete(leaf) {
    const B = this.ctx(leaf);
    for (const n of B.path) for (const I of expand(this.sys, n, B)) if (!this.sat(I, B, n.id)) return { node: n, I };
    for (const rid of structOf(this.sys)) for (const I of STRUCT[rid].inst(this.sys, B)) if (!this.sat(I, B, null)) return { struct: rid, I };
    return null;
  }
  declare(leafId) {
    const leaf = this.node(leafId);
    if (!leaf || leaf.kids.length) return { error: 'Elige el final de una rama.' };
    if (leaf.close) return { error: 'Esa rama ya está cerrada.' };
    if (this.findClash(leaf)) return { error: 'Esa rama tiene una contradicción: ciérrala.' };
    const inc = this.incomplete(leaf);
    if (inc) {
      const M = readModel(this, leaf);
      if (!(M && checkModel(this.sys, M, this.prem, this.concl))) {
        const what = inc.node ? 'la línea ' + inc.node.id : 'la regla ' + inc.struct;
        return { error: 'Todavía no está completa: falta aplicar ' + what + ' en esta rama.', inc };
      }
    }

    return { ok: true };
  }
  clone() {
    const t = Object.create(Tab.prototype);
    Object.assign(t, this);
    t.nodes = this.nodes.map(n => Object.assign({}, n, { kids: n.kids.slice(), close: n.close ? { by: n.close.by.slice() } : null }));
    t.root = t.nodes[0];
    return t;
  }
}

/* ================= estrategia automática (pistas, solución y la máquina) ================= */
function nextMove(t) {
  for (const leaf of t.openLeaves()) {
    if (leaf.decl) continue;
    const c = t.findClash(leaf);
    if (c) return { kind: 'close', ids: c, leaf: leaf.id };
  }
  const cands = [];
  t.openLeaves().forEach(leaf => {
    if (leaf.decl) return;
    const B = t.ctx(leaf);
    B.path.forEach(n => expand(t.sys, n, B).forEach(I => {
      if (t.sat(I, B, n.id)) return;
      const reuse = ['□', '∀', '[F]', '[P]', '>', '→+', '¬→−', '⊐+', '¬+'].includes(I.r);
      const br = !I.fresh && I.alts.length > 1;
      const pr = I.fresh ? 3 : br ? (reuse ? 5 : 4) : (reuse ? 2 : 0);
      cands.push({ pr, kind: 'rule', id: n.id, depth: B.path.indexOf(n) });
    }));
    structOf(t.sys).forEach(rid => STRUCT[rid].inst(t.sys, B).forEach(I => {
      if (t.sat(I, B, null)) return;
      const pr = STRUCT[rid].fresh ? 6 : rid === 'C+' ? 5 : 1;
      cands.push({ pr, kind: 'struct', rid, depth: 0 });
    }));
  });
  if (!cands.length) return null;
  cands.sort((a, b) => a.pr - b.pr || a.depth - b.depth);
  return cands[0];
}
function doMove(t, m) {
  if (m.kind === 'close') return t.tryClose(m.ids[0], m.ids[1]);
  if (m.kind === 'rule') return t.apply(m.id);
  return t.applyStruct(m.rid);
}
/* construye el árbol entero; budget = máximo de líneas */
function solve(sysId, prem, concl, budget) {
  const t = new Tab(sysId, prem, concl);
  const moves = [];
  budget = budget || 400;
  for (let k = 0; k < 2000 && t.nodes.length < budget; k++) {
    const m = nextMove(t);
    if (!m) break;
    let r;
    try { r = doMove(t, m); } catch (e) { if (e instanceof L.LErr) break; throw e; }
    if (r.error) break;
    moves.push(m);
    if (t.status() === 'closed') break;
  }
  let verdict = t.status() === 'closed' ? 'valid' : 'unknown', open = null;
  if (verdict !== 'valid') {
    for (const leaf of t.openLeaves()) {
      if (t.findClash(leaf)) continue;
      if (!t.incomplete(leaf)) { open = leaf; break; }
      const M = readModel(t, leaf);
      if (M && checkModel(t.sys, M, prem, concl)) { open = leaf; break; }
    }
    if (open) { verdict = 'invalid'; }
  }
  return { t, verdict, open, moves };
}

/* ================= contramodelos ================= */
/* lee la interpretación que induce una rama abierta, como en el libro */
function readModel(t, leaf) {
  const sys = t.sys, B = t.ctx(leaf), path = B.path;
  const lits = path.filter(n => n.k === 'f');
  const M = { sys: sys.id, W: sys.W ? B.worlds.slice() : [null], R: [], RA: [], pos: {}, neg: {}, fixed: {}, normal: [] };
  if (sys.neg === 'star') {
    const all = new Set();
    M.W.forEach(w => { all.add(base(w)); all.add(base(w) + '#'); });
    M.W = [...all].sort((a, b) => parseInt(a, 10) - parseInt(b, 10) || (a.endsWith('#') ? 1 : -1));
  }
  M.W.forEach(w => { M.pos[w] = new Set(); M.neg[w] = new Set(); M.fixed[w] = {}; });
  /* identidad: cada nombre se representa por el primero de su clase */
  const repOf = {};
  const consts = [...B.consts].sort();
  consts.forEach(c => { repOf[c] = c; });
  const find = c => (repOf[c] === c ? c : (repOf[c] = find(repOf[c])));
  lits.forEach(n => { if (!n.s && n.f.t === 'atom' && n.f.p === '=') { const a = find(n.f.args[0]), b = find(n.f.args[1]); if (a !== b) repOf[a > b ? a : b] = a < b ? a : b; } });
  M.rep = c => find(c);

/* Ramón escribe letra a letra, con voz de pitidos, y mueve la boca mientras habla */
function typewriter(el) {
  const box = el.closest('.dialog');
  const bird = box && box.querySelector('.owl');
  if (bird) bird.classList.add('fresh');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const units = [];
  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 3) {
        const frag = document.createDocumentFragment();
        ch.textContent.split(/(\s+)/).forEach(tok => {
          if (!tok) return;
          if (/^\s+$/.test(tok)) { frag.appendChild(document.createTextNode(tok)); return; }
          const word = document.createElement('span');
          word.className = 'tww';
          for (const c of tok) { const sp = document.createElement('span'); sp.className = 'twh'; sp.textContent = c; word.appendChild(sp); units.push(sp); }
          frag.appendChild(word);
        });
        ch.replaceWith(frag);
      } else if (ch.nodeName.toLowerCase() === 'svg') { ch.classList.add('twh'); units.push(ch); }
      else if (ch.nodeName.toLowerCase() === 'button') { ch.classList.add('twh'); units.push(ch); }
      else walk(ch);
    });
  };
  walk(el);
  if (bird) bird.classList.add('talk');
  let i = 0, n = 0;
  twTimer = setInterval(() => {
    for (let k = 0; k < 2 && i < units.length; k++) units[i++].classList.remove('twh');
    if (n++ % 2 === 0) AU.blip();
    if (i >= units.length) { clearInterval(twTimer); if (bird) bird.classList.remove('talk'); }
  }, 30);
}
function twDone() {
  const hidden = app.querySelectorAll('.twh');
  if (!hidden.length) return true;
  clearInterval(twTimer);
  hidden.forEach(e => e.classList.remove('twh'));
  app.querySelectorAll('.owl.talk').forEach(o => o.classList.remove('talk'));
  return false;
}

const IDLE = 'Toca una línea y pulsa <b>Aplicar regla</b>. Para cerrar una rama, toca dos líneas que choquen y pulsa <b>Cerrar</b>.';
const wl = w => (w == null ? '' : w.endsWith('#') ? w.slice(0, -1) + '#' : w);
function nodeText(n) {
  if (n.k === 'r') return `<span class="trel">${esc(n.a)}<i>r</i>${n.A ? `<sub>${fh(n.A)}</sub>` : ''}${esc(n.b)}</span>`;

/* una línea queda marcada ✓ cuando su regla ya dejó todo lo que tenía que dejar (las de □ y ∀ nunca, como en el libro) */
const REUSE = new Set(['□', '∀', '[F]', '[P]', '>', '→+', '¬→−', '⊐+', '¬+']);
function ticked(t, n) {
  if (n.k !== 'f') return false;
  const kid = t.nodes.find(m => m.src === n.id);
  if (!kid || REUSE.has(kid.rule)) return false;
  return !t.pending(n).length;
}
function treeHTML(t, o) {
  o = o || {};
  const sel = new Set(o.sel || []), still = o.still;
  const seg = start => {
    const chain = [start];
    let cur = start;
    while (cur.kids.length === 1) { cur = t.node(cur.kids[0]); chain.push(cur); }
    const rows = chain.map(n => {
      const cls = ['tn'];
      if (sel.has(n.id)) cls.push('sel');
      if (o.flash && n.id >= o.flash) cls.push('new');
      if (n.rule === 'ini') cls.push('ini');
      if (!still && ticked(t, n)) cls.push('used');
      const just = n.rule && n.rule !== 'ini' ? `<span class="tj">${raw(n.rule)}${n.src ? ' ' + n.src : ''}</span>` : '';
      return still
        ? `<div class="${cls.join(' ')}"><span class="tnum">${n.id}</span><span class="tf">${nodeText(n)}</span>${just}</div>`
        : `<button class="${cls.join(' ')}" data-act="tnode" data-i="${n.id}"><span class="tnum">${n.id}</span><span class="tf">${nodeText(n)}</span>${just}${cls.includes('used') ? `<span class="tick">${ico('check')}</span>` : ''}</button>`;
    }).join('');
    let tail = '';
    if (cur.kids.length > 1) tail = `<div class="tkids">${cur.kids.map(k => `<div class="tbr">${seg(t.node(k))}</div>`).join('')}</div>`;
    else if (cur.close) tail = `<div class="ttip closed" title="Rama cerrada">×<small>${cur.close.by.join(', ')}</small></div>`;
    else if (cur.decl || (still && o.openLeaf === cur.id)) tail = `<div class="ttip openb" title="Rama abierta">${ico('↑')}</div>`;
    else if (!still) tail = `<button class="ttip ${sel.has(-cur.id) ? 'sel' : ''}" data-act="ttip" data-i="${cur.id}" title="Final de la rama">○</button>`;
    return `<div class="tseg">${rows}${tail}</div>`;
  };
  return `<div class="tree${still ? ' still' : ''}">${seg(t.root)}</div>`;
}

/* ----- contramodelos ----- */
const VN = { 1: '1', 0: '0', b: 'b', n: 'n', '1': '1', '0': '0' };
const vcls = v => (v === 1 || v === '1' ? 'v2' : v === 'b' || v === 'n' || v === 0.5 ? 'v1' : 'v0');
const vchip = v => `<span class="vchip ${vcls(v)}">${esc(VN[v] != null ? VN[v] : v)}</span>`;
function worldName(w) { return w == null ? '' : w.endsWith('#') ? 'w' + w.slice(0, -1) + '*' : 'w' + w; }
function modelHTML(sys, M, prem, concl) {
  let body = '';
  const atoms = L.atomsOf([...prem, concl]);
  if (!sys.W) {
    if (sys.fo) {
      const preds = {};
      M.pos[null].forEach(a => { const p = a[0]; if (p !== '=' && p !== 'E') (preds[p] = preds[p] || []).push(a.slice(1)); });
      const ps = [...new Set(L.subformulas(L.Bin('and', concl, prem.length ? prem.reduce((x, y) => L.Bin('and', x, y)) : concl)).filter(g => g.t === 'atom' && g.args.length && g.p !== '=' && g.p !== 'E').map(g => g.p))].sort();
      body = `<p class="cap">Dominio: un objeto por cada nombre de la rama${M.dom.some(d => M.dom.length && d) ? '' : ''}: <b>{${M.dom.join(', ')}}</b>${sys.fo === 'free' ? ` · existen: <b>{${[...M.E[null]].join(', ')}}</b>` : ''}</p>
        <div class="gats">${ps.map(p => `<span class="gat">${fm(p)} = {${(preds[p] || []).map(t => t.length > 1 ? '⟨' + t.split('').join(',') + '⟩' : t).join(', ')}}</span>`).join('')}</div>`;
    } else {
      body = `<div class="gats">${atoms.map(p => {
        let v;
        if (sys.sg) { const t = M.pos[null].has(p), f = M.neg[null].has(p); v = t ? (f ? 'b' : '1') : (f ? '0' : 'n'); }
        else v = M.pos[null].has(p) ? 1 : 0;
        return `<span class="gat">${fm(p)} ${vchip(v)}</span>`;
      }).join('')}</div>${sys.sg ? '<p class="cap">1: solo verdadera · 0: solo falsa · b: ambas · n: ninguna</p>' : ''}`;
    }
  } else {
    const lits = {};
    M.W.forEach(w => {
      const l = [];
      M.pos[w].forEach(p => l.push(sys.sg && !sys.int && sys.neg !== 'star' ? '+' + p : p));
      if (sys.sg && !sys.int && sys.neg !== 'star') M.neg[w].forEach(p => l.push('+¬' + p));
      else if (!sys.sg) M.neg[w].forEach(p => l.push('¬' + p));
      Object.keys(M.fixed[w] || {}).forEach(k => {
        if (!sys.sg) l.push((M.fixed[w][k] ? '' : '¬') + k);
        else if (k[0] === '1') l.push('+' + k.slice(1));
        else if (k[0] === '0') l.push('+¬' + k.slice(1));
      });
      lits[w] = l;
    });
    const R = sys.md === 'U' || sys.cond ? [] : M.R;
    body = modelDiagram({ W: M.W, R, RA: M.RA, lits, nn: M.W.filter(w => !M.normal.includes(w)), root: '0', names: Object.fromEntries(M.W.map(w => [w, worldName(w)])), star: sys.neg === 'star' })
      + `<p class="cap">${sys.md === 'U' || sys.cond ? 'Todos los mundos se ven entre sí. ' : ''}${M.W.some(w => !M.normal.includes(w)) ? 'Con borde punteado: mundos no normales. ' : ''}${sys.neg === 'star' ? 'w0* es el mundo estrella de w0. ' : ''}Lo que no figura en un mundo es falso allí${sys.sg && !sys.int ? ' (o «no verdadero»)' : ''}.</p>`;
  }
  const val = f => vchip(TB.valueAt(sys, M, f));
  return `<div class="mlabel">CONTRAMODELO</div>${body}
    <div class="tw"><table class="tbl vt"><tbody>${prem.map(f => `<tr><td class="lab">Premisa</td><td>${fh(f)}</td><td>${val(f)}</td></tr>`).join('')}
    <tr><td class="lab">Conclusión</td><td>${fh(concl)}</td><td>${val(concl)}</td></tr></tbody></table></div>`;
}
/* dibujo de un modelo de mundos: columnas por distancia a la raíz */
function modelDiagram(D) {
  const ids = D.W, n = ids.length, idx = {};
  ids.forEach((w, i) => { idx[w] = i; });
  const E = [];
  (D.R || []).forEach(([a, b]) => { if (a !== b && idx[a] != null && idx[b] != null) E.push([idx[a], idx[b], '']); });
  (D.RA || []).forEach(([a, b, A]) => { if (idx[a] != null && idx[b] != null) E.push([idx[a], idx[b], A]); });
  const loops = new Set((D.R || []).filter(([a, b]) => a === b).map(([a]) => a));
  const loopsA = {};
  (D.RA || []).forEach(([a, b, A]) => { if (a === b) (loopsA[a] = loopsA[a] || []).push(A); });
  const lev = new Array(n).fill(-1);
  const r0 = idx[D.root] != null ? idx[D.root] : 0;
  lev[r0] = 0;
  for (let q = [r0]; q.length;) { const a = q.shift(); E.forEach(([x, y]) => { if (x === a && lev[y] < 0) { lev[y] = lev[a] + 1; q.push(y); } }); }
  lev.forEach((l, i) => { if (l < 0) lev[i] = D.star && ids[i].endsWith('#') ? lev[idx[ids[i].slice(0, -1)]] : 1; });
  if (D.star) ids.forEach((w, i) => { if (w.endsWith('#') && idx[w.slice(0, -1)] != null) lev[i] = lev[idx[w.slice(0, -1)]]; });
  const cols = [];
  lev.forEach((l, i) => { (cols[l] = cols[l] || []).push(i); });
  const BW = 136, GX = 70, GY = 18;
  const BH = Math.max(54, ...ids.map(w => 32 + Math.ceil((D.lits[w] || []).join(', ').length / 16) * 18));
  const rows = Math.max(1, ...cols.filter(Boolean).map(c => c.length));
  const nc = cols.length;
  const Wd = nc * (BW + GX) - GX, H = rows * (BH + GY) - GY, pos = [];
  cols.forEach((c, l) => { if (c) c.forEach((i, k) => { pos[i] = { x: l * (BW + GX), y: (H - (c.length * (BH + GY) - GY)) / 2 + k * (BH + GY) }; }); });
  const tip = (x, y, ux, uy) => `<path d="M${x} ${y} L${x - 11 * ux + 6 * uy} ${y - 11 * uy - 6 * ux} L${x - 11 * ux - 6 * uy} ${y - 11 * uy + 6 * ux} z"/>`;
  const seen = new Set();
  let svg = '', labs = '';
  E.forEach(([a, b, A]) => {
    const k = Math.min(a, b) + '-' + Math.max(a, b) + A;
    if (seen.has(k)) return;
    seen.add(k);
    const both = E.some(([x, y, B]) => x === b && y === a && B === A);
    const P = pos[a], Q = pos[b];
    if (!P || !Q) return;
    const ax = P.x + BW / 2, ay = P.y + BH / 2, bx = Q.x + BW / 2, by = Q.y + BH / 2;
    const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    const t = Math.min((BW / 2 + 6) / (Math.abs(dx) || 1e-9), (BH / 2 + 6) / (Math.abs(dy) || 1e-9)) * d;
    const x1 = ax + ux * t, y1 = ay + uy * t, x2 = bx - ux * t, y2 = by - uy * t;
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>` + tip(x2, y2, ux, uy) + (both ? tip(x1, y1, -ux, -uy) : '');
    if (A) labs += `<span class="elab" style="left:${(x1 + x2) / 2}px;top:${(y1 + y2) / 2}px">${fm(A)}</span>`;
  });
  const boxes = ids.map((w, i) => {
    const t = D.lits[w] || [];
    const loop = loops.has(w) ? `<em>${ico('loop')}</em>` : '';
    const la = loopsA[w] ? `<em class="la">${ico('loop')}<sub>${loopsA[w].map(fm).join(',')}</sub></em>` : '';
    const cls = ['world', w === D.root ? 'root' : '', (D.nn || []).includes(w) ? 'nn' : ''].join(' ');
    return `<div class="${cls}" style="left:${pos[i].x}px;top:${pos[i].y}px;width:${BW}px;height:${BH}px"><b>${esc(D.names[w])}${loop}${la}</b><span>${t.length ? t.map(fm).join(', ') : '–'}</span></div>`;
  }).join('');
  return `<div class="kr-wrap"><div class="kmodel" style="width:${Wd}px;height:${H}px"><svg viewBox="0 0 ${Wd} ${H}" width="${Wd}" height="${H}" aria-hidden="true">${svg}</svg>${boxes}${labs}</div></div>`;
}

function labSay(r) {

function labGoals(r) {

}

}
function labRun() {

/* teclado de fórmulas: las letras y conectivas de la etapa */
function alphabet() {
  const s = ST.stage, preds = new Set(), nm = new Set();
  const fs = [...ST.prem, ...(ST.concl ? [ST.concl] : []), ...labSug()];
  let fo = false;
  fs.forEach(f => L.subformulas(f).forEach(g => {
    if (g.t !== 'atom') return;
    if (g.args.length) { fo = true; if (g.p !== '=') preds.add(g.p); g.args.forEach(a => { if (L.isConst(a)) nm.add(a); }); }
    else preds.add(g.p);
  }));
  const syms = [...(s.syms || '¬∧∨⊃')];
  if (syms.includes('∀')) fo = true;
  (fo ? 'PQ' : 'pqr').split('').forEach(c => preds.add(c));
  const terms = fo ? [...new Set([...nm, 'a', 'b'])].sort().concat(['x', 'y']) : [];
  return { preds: [...preds].sort(), terms, syms, fo };
}

  try {
    const f = L.parse(FD.buf);
    if (!L.closed(f)) throw new L.LErr('Hay una variable suelta. Usa un nombre (a, b, c) o un cuantificador.');
    return { f };
  } catch (e) { if (e instanceof L.LErr) return { err: e.message }; throw e; }
}
function fdRefresh() {
  const d = document.getElementById('fdisp'), s = document.getElementById('fstat');
  if (!d) return;
  d.innerHTML = `<span class="fm">${raw(FD.buf)}</span><span class="caret"></span>`;
  if (!FD.buf) { s.className = 'fstat'; s.textContent = ''; return; }
  const r = fdCheck();
  s.className = 'fstat ' + (r.f ? 'good' : 'no');
  s.innerHTML = r.f ? ico('check') + ' Fórmula bien formada' : esc(r.err);
}
function fdKey(k) {
  if (k === 'bs') FD.buf = [...FD.buf].slice(0, -1).join('');
  else if ([...FD.buf].length < 48) FD.buf += k;
  sfx.sel();
  fdRefresh();
}
function fdOK() { const r = fdCheck(); if (r.err) { sfx.err(); fdRefresh(); return; } FD.onOK(r.f); }
function openSound() {
  const row = (lab, k) => `<div class="vol"><b>${lab}</b>
    <button class="btn sm" data-act="vol" data-k="${k}" data-d="-1" aria-label="Bajar ${lab.toLowerCase()}" ${save[k] <= 0 ? 'disabled' : ''}>-</button>
    <span class="vmeter" role="img" aria-label="${lab}: ${save[k]} de 5">${meter(save[k])}</span>
    <button class="btn sm" data-act="vol" data-k="${k}" data-d="1" aria-label="Subir ${lab.toLowerCase()}" ${save[k] >= 5 ? 'disabled' : ''}>+</button></div>`;
  showModal(`<h3>Volumen</h3>${row('Música', 'mv')}${row('Efectos', 'sv')}
    <div class="mrow"><button class="btn pri" data-act="mcancel">Listo</button></div>`, 'snddlg');
}
/* libro de reglas: las reglas del sistema de la etapa, dibujadas por el motor a partir de ejemplos */
function openBook() {
  const sys = ST.tab.sys;
  const rows = C.RULEBOOK(sys).map(r => `<div class="brow"><span class="rbtn static">${raw(r.id)}</span><div><b>${tx(r.name)}</b><p>${tx(r.desc)}</p></div></div>`).join('');
  const st = TB.structOf(sys).map(rid => `<div class="brow"><span class="rbtn static">${raw(rid === 'her' ? 'her.' : rid)}</span><div><b>${TB.STRUCT[rid].name}</b><p>${tx(TB.STRUCT[rid].desc)}</p></div></div>`).join('');
  showModal(`<h3>Reglas de ${esc(sysName(sys.id))}</h3><div class="book">${rows}${st}<div class="brow"><span class="rbtn static">×</span><div><b>Cierre</b><p>${tx(C.CLOSURE(sys))}</p></div></div></div>
    <div class="mrow"><button class="btn pri" data-act="mcancel">Cerrar</button></div>`, 'bookdlg');
}
function winModal(stars, word, detail) {
  const W = C.worlds[V.w], last = V.s === W.stages.length - 1;
  const outro = ST.stage.outro ? `<p class="outro">${tx(ST.stage.outro)}</p>` : '';
  showModal(`<div class="winowl">${owl(4, 'happy')}</div><div class="qed">${word}</div>
    <div class="bigstars">${starsHTML(stars)}</div>
    <p class="detail">${detail}</p>${outro}
    <div class="mrow"><button class="btn" data-act="again">Repetir</button><button class="btn" data-act="mcancel">Ver el árbol</button><button class="btn" data-act="toWorld">Etapas</button>
    <button class="btn pri" data-act="next"><span>${last ? 'Al mapa' : 'Siguiente'}</span>${ico('next')}</button></div>`, 'win');
}
function nextStage() {
  const W = C.worlds[V.w];
  if (V.s < W.stages.length - 1) go('stage', V.w, V.s + 1); else go('map');
}

/* ---------- acciones ---------- */
const ACT = {
  start() { sfx.ok(); go('map'); },
  title() { go('title'); },
  map() { go('map'); },
  toWorld() { go('world'); },
  sound() { openSound(); },
  vol(d) { save[d.k] = Math.max(0, Math.min(5, save[d.k] + (+d.d))); persist(); applySound(); sfx.sel(); render(); openSound(); },
  free() { save.free = !save.free; persist(); sfx.sel(); render(); },
  theme() { save.theme = { '': 'light', light: 'dark', dark: '' }[save.theme]; persist(); applyTheme(); sfx.sel(); render(); },
  wipe() {
    showModal(`<h3>¿Borrar todo el progreso?</h3><p>Se perderán las etapas completadas y las estrellas.</p>
      <div class="mrow"><button class="btn pri" data-act="mcancel">No, volver</button><button class="btn" data-act="wipeYes">Sí, borrar</button></div>`);
  },
  wipeYes() { save.done = {}; persist(); closeModal(); render(); },
  world(d) { if (!worldOpen(+d.w)) { sfx.err(); return; } sfx.sel(); go('world', +d.w); },
  stage(d) { if (!stageOpen(V.w, +d.s)) { sfx.err(); return; } sfx.sel(); go('stage', V.w, +d.s); },
  again() { go('stage'); },
  next() { nextStage(); },

  twskip() { twDone(); },
  tprev() { if (ST.page) { ST.page--; sfx.page(); render(); } },
  tnext() {
    if (!twDone()) return;
    if (ST.page < ST.stage.pages.length - 1) { ST.page++; sfx.page(); render(); return; }
    save.done[sid(V.w, V.s)] = 1; persist(); sfx.ok();
    nextStage();
  },

  tnode(d) {
    if (ST.type !== 'A' || ST.solved || ST.playing) return;
    const id = +d.i;
    ST.sel = ST.sel.filter(x => x > 0);
    const at = ST.sel.indexOf(id);
    if (at >= 0) ST.sel.splice(at, 1); else { ST.sel.push(id); if (ST.sel.length > 2) ST.sel.shift(); }
    ST.flash = null;
    sfx.sel(); render();
  },
  ttip(d) {
    if (ST.type !== 'A' || ST.solved || ST.playing) return;
    const id = -(+d.i);
    ST.sel = ST.sel.includes(id) ? [] : [id];
    ST.flash = null;
    sfx.sel(); render();
  },
  trule() {
    const ns = selNodes();
    if (ns.length !== 1) { sfx.err(); say('err', 'Toca primero una sola línea: la que quieres desarrollar.'); render(); return; }
    snapshot();
    const before = ST.tab.nodes.length;
    const r = ST.tab.apply(ns[0].id);
    ST.flash = r.ok ? before + 1 : null;
    after(r);
  },
  tclose() {
    const ns = selNodes();
    if (!ns.length) { sfx.err(); say('err', 'Toca dos líneas de la misma rama que se contradigan.'); render(); return; }
    snapshot();
    ST.flash = null;
    after(ST.tab.tryClose(ns[0].id, ns[1] ? ns[1].id : null), 'Rama cerrada. ' + (ST.tab.status() === 'busy' ? 'Sigue con las demás.' : ''));
  },
  topen() {
    const tip = ST.sel.find(x => x < 0);
    if (!tip) { sfx.err(); say('err', 'Toca el final de una rama (○) para declararla abierta.'); render(); return; }
    snapshot();
    const r = ST.tab.declare(-tip);
    if (r.ok) ST.model = TB.readModel(ST.tab, ST.tab.node(-tip));
    after(r);
  },
  tstruct(d) {
    snapshot();
    const before = ST.tab.nodes.length;
    const r = ST.tab.applyStruct(d.r);
    ST.flash = r.ok ? before + 1 : null;
    after(r);
  },
  undo() { if (!ST.hist.length) return; ST.tab = ST.hist.pop(); ST.sel = []; ST.flash = null; ST.model = null; say('info', IDLE); sfx.page(); render(); },
  reset() { ST.tab = new TB.Tab(ST.stage.sys, ST.prem, ST.concl); ST.hist = []; ST.sel = []; ST.flash = null; ST.model = null; say('info', tx(ST.stage.intro || IDLE)); sfx.page(); render(); },
  hint() {
    ST.hints++;
    const extra = ST.stage.hints && ST.stage.hints[ST.hints - 1] ? tx(ST.stage.hints[ST.hints - 1]) + ' ' : '';
    say('hint', `<b>Pista ${ST.hints}.</b> ${extra}${hintText(ST.tab)}${ST.hints >= 3 ? ' <button class="btn sm" data-act="solve">Ver la solución</button>' : ''}`);
    sfx.page(); render();
  },
  solve() { playSolution(); },
  book() { openBook(); },

  fkey(d) { fdKey(d.k); },
  fsug(d) { FD.onOK(FD.sug[+d.i]); },
  fok() { fdOK(); },
  mcancel() { closeModal(); },

  tcell(d) {
    const c = +d.c, r = +d.r, vals = SEM.MV[ST.stage.sys].vals, x = ST.cells[c][r];
    ST.cells[c][r] = x == null ? vals[0] : vals[(vals.indexOf(x) + 1) % vals.length];
    if (ST.mark) ST.mark[c][r] = '';
    sfx.sel(); render();
  },
  tclear() { ST.cells = ST.cols.map(() => ST.rows.map(() => null)); ST.mark = null; say('info', tx(ST.stage.intro)); sfx.page(); render(); },
  tcheck() {
    ST.checks++;
    let bad = 0;
    ST.mark = ST.cols.map((f, c) => ST.rows.map((v, r) => { const ok = SEM.evMV(ST.stage.sys, f, v) === ST.cells[c][r]; if (!ok) bad++; return ok ? 'good' : 'bad'; }));
    if (bad) { sfx.err(); say('err', `Hay ${bad} ${bad === 1 ? 'casilla que no cuadra' : 'casillas que no cuadran'}, en rojo. Revisa el conector principal de esa columna.`); render(); return; }
    ST.solved = true;
    const stars = ST.checks === 1 ? 3 : ST.checks === 2 ? 2 : 1;
    finish(stars);
    say('ok', '¡Tabla correcta!');
    render();
    const mine = ST;
    setTimeout(() => { if (ST === mine && V.scr === 'stage') winModal(stars, '¡BIEN!', mine.checks === 1 ? 'Correcta a la primera' : mine.checks + ' comprobaciones'); }, 600);
  },
  val(d) {
    const vals = SEM.MV[ST.stage.sys].vals;
    ST.val[d.a] = vals.find(v => String(v) === d.v); ST.moves++;
    sfx.sel(); render();
    if (ST.all && !ST.solved) {
      ST.solved = true;
      const stars = ST.moves <= ST.atoms.length + 1 ? 3 : 2;
      finish(stars);
      const mine = ST;
      setTimeout(() => { if (ST === mine) winModal(stars, '¡BIEN!', mine.goal ? 'Premisas designadas y conclusión no: la inferencia es inválida.' : 'Todas designadas a la vez.'); }, 500);
    }
  },
  qpick(d) {
    const q = ST.stage.qs[ST.i], i = +d.i;
    if (i === q.ok) { ST.picked = i; sfx.ok(); } else { ST.bad.push(i); ST.wrong++; sfx.err(); }
    render();
  },
  vadd() { labEdit('Escribe una premisa', f => { ST.prem.push(f); }); },
  vconc() { labEdit('Escribe la conclusión', f => { ST.concl = f; }); },
  vdel(d) { ST.prem.splice(+d.i, 1); ST.res = null; sfx.page(); render(); },
  vdelc() { ST.concl = null; ST.res = null; sfx.page(); render(); },
  vclear() { ST.prem = []; ST.concl = null; ST.res = null; say('info', tx(ST.stage.intro)); sfx.page(); render(); },
  vex(d) {
    const x = labEx(ST.stage.ex[+d.i]);
    ST.prem = x.prem; ST.concl = x.concl;
    if (x.sys && ST.stage.sys.includes(x.sys)) ST.sys = x.sys;
    sfx.sel(); labRun();
  },
  vsys(d) { ST.sys = d.x; sfx.sel(); if (ST.concl) labRun(); else render(); },
  vrun() { labRun(); },
  qnext() {
    if (ST.i < ST.stage.qs.length - 1) { ST.i++; ST.picked = -1; ST.bad = []; sfx.page(); render(); return; }
    const stars = ST.wrong === 0 ? 3 : ST.wrong <= 2 ? 2 : 1;
    finish(stars);
    winModal(stars, '¡BIEN!', ST.wrong ? `${ST.wrong} ${ST.wrong === 1 ? 'fallo' : 'fallos'}` : 'Sin fallos');
  }
};
/* ---------- mando: cruceta, A, B, L, R, START y SELECT ---------- */
let padOn = false;
let padKey = null, padKeyApp = null, padClick = false;
const keyOf = e => Object.keys(e.dataset).sort().map(k => k + '=' + e.dataset[k]).join('&');
function padCands() {
  const rootEl = modal.hidden ? app : modal;
  return [...rootEl.querySelectorAll('button:not(:disabled)')].filter(e => e.offsetParent !== null && !e.classList.contains('locked'));
}
function padCur() { return padOn && padKey ? padCands().find(e => keyOf(e) === padKey) || null : null; }
function padShow() {
  document.querySelectorAll('.padf').forEach(e => e.classList.remove('padf'));
  const e = padCur();
  if (e) { e.classList.add('padf'); e.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
  return e;
}
function padDefault() {
  const c = padCands();
  return c.find(e => e.classList.contains('pri')) || c.find(e => !e.closest('.hud') && !e.closest('.tsnd')) || c[0] || null;
}
function padSet(e) { padOn = true; padKey = e ? keyOf(e) : null; padShow(); }
function padMove(dir) {
  const cur = padCur();
  if (!cur) { padSet(padDefault()); return; }
  const r0 = cur.getBoundingClientRect(), x0 = r0.left + r0.width / 2, y0 = r0.top + r0.height / 2;
  let best = null, bs = Infinity;
  padCands().forEach(e => {
    if (e === cur) return;
    const r = e.getBoundingClientRect(), dx = r.left + r.width / 2 - x0, dy = r.top + r.height / 2 - y0;
    const horiz = dir === 'left' || dir === 'right';
    const along = dir === 'left' ? -dx : dir === 'right' ? dx : dir === 'up' ? -dy : dy;
    if (along < 6) return;
    const overlap = horiz ? Math.min(r0.bottom, r.bottom) - Math.max(r0.top, r.top) : Math.min(r0.right, r.right) - Math.max(r0.left, r.left);
    const across = Math.abs(horiz ? dy : dx);
    const score = along + across * (overlap > 4 ? 0.4 : 2.6);
    if (score < bs) { bs = score; best = e; }
  });
  if (best) { padSet(best); sfx.sel(); }
}
function padPress(k) {
  AU.unlock();
  const inModal = !modal.hidden, T = V.scr === 'stage' && ST ? ST.type : '';
  if (k === 'up' || k === 'down' || k === 'left' || k === 'right') {
    if (!inModal && T === 'T' && (k === 'left' || k === 'right')) { ACT[k === 'left' ? 'tprev' : 'tnext'](); return; }
    padMove(k); return;
  }
  if (k === 'A') {
    if (!inModal && app.querySelector('.twh')) { twDone(); return; }
    const cur = padCur();
    if (cur) { padClick = true; try { cur.click(); } finally { padClick = false; } return; }
    if (!inModal && V.scr === 'title') { ACT.start(); return; }
    if (!inModal && T === 'T') { ACT.tnext(); return; }
    padSet(padDefault()); return;
  }
  if (k === 'B') {
    if (inModal) { if (modal.querySelector('.win')) ACT.toWorld(); else closeModal(); sfx.page(); return; }
    const back = app.querySelector('.hud [data-act]');
    if (back) { sfx.page(); back.click(); }
    return;
  }
  if (k === 'start') {
    if (inModal) { if (modal.querySelector('.snddlg')) closeModal(); return; }
    if (V.scr === 'title') ACT.start(); else if (T === 'A' && !ST.solved && !ST.playing) ACT.trule(); else openSound();
    return;
  }
  if (inModal) return;
  if (V.scr === 'map' || V.scr === 'world') {
    if (k === 'L' || k === 'R') {
      const w = V.w + (k === 'L' ? -1 : 1);
      if (V.scr === 'world' && w >= 0 && w < C.worlds.length && worldOpen(w)) { sfx.sel(); go('world', w); }
    }
    return;
  }
  if (T === 'T') { if (k === 'L') ACT.tprev(); if (k === 'R') ACT.tnext(); return; }
  if (T === 'A' && !ST.solved && !ST.playing) {
    if (k === 'L') ACT.undo();
    if (k === 'R') ACT.hint();
    if (k === 'select') openBook();
    return;
  }
  if (T === 'TT' && !ST.solved) {
    if (k === 'R' && ST.cells.every(col => col.every(x => x != null))) ACT.tcheck();
    if (k === 'select') ACT.tclear();
    return;
  }
  if (T === 'V' && !ST.busy) {
    if (k === 'R') labRun();
    if (k === 'select') ACT.vclear();
    if (k === 'L' && ST.stage.sys.length > 1) { const ss = ST.stage.sys; ACT.vsys({ x: ss[(ss.indexOf(ST.sys) + 1) % ss.length] }); }
    return;
  }
  if (T === 'Q' && k === 'R') { const n = app.querySelector('[data-act=qnext]'); if (n) n.click(); }
}
function legend() {
  const el = document.getElementById('legend');
  if (!el) return;
  const T = V.scr === 'stage' && ST ? ST.type : '';
  let items;
  if (!modal.hidden) items = [['A', 'elegir'], ['B', modal.querySelector('.win') ? 'etapas' : 'cerrar']];
  else if (V.scr === 'title') items = [['A', 'jugar'], ['START', 'jugar']];
  else if (V.scr === 'map') items = [['A', 'entrar'], ['B', 'portada'], ['START', 'volumen']];
  else if (V.scr === 'world') items = [['A', 'entrar'], ['B', 'mapa'], ['L R', 'otro capítulo']];
  else if (T === 'T') items = [['A', 'seguir'], ['B', 'salir'], ['L R', 'página']];
  else if (T === 'A') items = [['A', 'elegir'], ['START', 'aplicar'], ['B', 'salir'], ['L', 'deshacer'], ['R', 'pista'], ['SELECT', 'reglas']];
  else if (T === 'TT') items = [['A', 'cambiar'], ['B', 'salir'], ['R', 'comprobar'], ['SELECT', 'borrar']];
  else if (T === 'V') items = [['A', 'elegir'], ['B', 'salir'], ['R', 'construir'], ...(ST.stage.sys.length > 1 ? [['L', 'sistema']] : []), ['SELECT', 'vaciar']];
  else if (T === 'Q') items = [['A', 'elegir'], ['B', 'salir'], ['R', 'siguiente']];
  else items = [['A', 'elegir'], ['B', 'salir'], ['START', 'volumen']];
  el.innerHTML = items.map(([k, t]) => `<b>${k}</b> ${t}`).join(' · ');
}
document.querySelector('.pad').addEventListener('click', e => {
  const b = e.target.closest('[data-pad]');
  if (b) { padPress(b.dataset.pad); b.blur(); }
});
['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => AU.unlock(), true));
document.addEventListener('click', e => {
  if (e.target.closest('.pad')) return;
  if (!padClick && e.isTrusted && padOn) { padOn = false; padShow(); }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) { if (e.target === modal && !modal.querySelector('.win')) closeModal(); return; }
  const fn = ACT[b.dataset.act];
  if (fn) fn(b.dataset, b);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key.toLowerCase() === 'z' && V.scr === 'stage' && ST.type === 'A' && modal.hidden) { e.preventDefault(); ACT.undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const DIR = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
  if (DIR) { e.preventDefault(); padPress(DIR); return; }
  if (!modal.hidden && FD) {
    if (e.key === 'Escape') { closeModal(); return; }
    const al = FD.al;
    if (e.key === 'Enter') { e.preventDefault(); const cur = padCur(); if (cur) padPress('A'); else fdOK(); return; }
    if (e.key === 'Backspace') { e.preventDefault(); fdKey('bs'); return; }
    let k = KEYMAP[e.key];
    if (k && k !== '(' && k !== ')' && !al.syms.includes(k)) k = null;
    if (!k && /^[a-zA-Z]$/.test(e.key)) {
      if (al.preds.includes(e.key)) k = e.key;
      else if (al.terms.includes(e.key)) k = e.key;
    }
    if (k) { e.preventDefault(); fdKey(k); }
    return;
  }
  const onCtl = e.target.matches && e.target.matches('button');
  if ((e.key === 'Enter' || e.key === ' ') && onCtl) return;
  const PADKEY = { z: 'A', x: 'B', a: 'L', s: 'R', enter: 'start', backspace: 'select', escape: 'B' }[e.key.toLowerCase()];
  if (PADKEY) { e.preventDefault(); padPress(PADKEY); }
});

/* icono de pestaña */
try {
  if (PULPO.neutral) {
    const link = document.createElement('link');
    link.rel = 'icon'; link.href = PULPO.neutral.base;
    document.head.appendChild(link);
  }
} catch (e) { /* sin icono */ }

window.LogicaArboles = { go, render, state: () => ST, owl, save, act: ACT };
render();
})();
